name: Build APK and IPK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  packages:
    name: ${{ matrix.series }} / ${{ matrix.arch }} / ${{ matrix.ext }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - series: '24.10'
            sdk: '24.10.8'
            arch: 'x86_64'
            ext: ipk
            package_separator: '_'
          - series: '25.12'
            sdk: '25.12.6'
            arch: 'x86_64'
            ext: apk
            package_separator: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check JavaScript syntax
        run: |
          node --check luci-theme-nova/htdocs/luci-static/resources/view/nova/dashboard.js
          node --check luci-theme-nova/htdocs/luci-static/nova/nova-shell.js
          node --check luci-theme-nova/htdocs/luci-static/nova/nova-lists.js
      - name: Test dashboard rendering
        run: node --test tests/dashboard.test.js tests/native-lists.test.js tests/navigation.test.js tests/menu-localization.test.js tests/package-integration.test.js
      - name: Test asset cache versions
        env:
          NOVA_ASSET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node --test tests/asset-version.test.js
      - name: Test dashboard and navigation layout in Chrome
        run: node --test tests/browser-layout.test.js
      - name: Test native overview and connection lists in Chrome
        run: node --test tests/native-lists-browser.test.js
      - name: Test click-only menu interactions in Chrome
        run: node --test tests/navigation-browser.test.js
      - name: Build from matching OpenWrt SDK
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: nova
          PACKAGES: luci-theme-nova
          BUILD_LOG: 1
      - name: Test actual built IPK assets and metadata
        if: matrix.ext == 'ipk'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' themes < <(find bin/packages -type f -name 'luci-theme-nova_*.ipk' -print0)
          test "${#themes[@]}" -eq 1
          bash scripts/test-built-ipks.sh "${themes[0]}" "$RUNNER_TEMP/nova-built-ipk-assets-test"
      - name: Install host APK build dependencies (test only)
        if: matrix.ext == 'apk'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev
      - name: Build pinned host APK tool (test only)
        if: matrix.ext == 'apk'
        run: bash scripts/build-host-apk.sh "$RUNNER_TEMP/nova-host-apk"
      - name: Test actual built APK assets after SDK minification
        if: matrix.ext == 'apk'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' themes < <(find bin/packages -type f -name 'luci-theme-nova-*.apk' -print0)
          test "${#themes[@]}" -eq 1
          bash scripts/test-built-apks.sh "$RUNNER_TEMP/nova-host-apk/build/src/apk" \
            "${themes[0]}" "$RUNNER_TEMP/nova-built-assets-test"
      - name: Test individual APK signatures with disposable keys
        if: matrix.ext == 'apk'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' themes < <(find bin/packages -type f -name 'luci-theme-nova-*.apk' -print0)
          test "${#themes[@]}" -eq 1
          bash scripts/test-apk-signing.sh "$RUNNER_TEMP/nova-host-apk/build/src/apk" \
            "${themes[0]}" "$RUNNER_TEMP/nova-test-signed"
      - name: Record source and package checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-provenance
          printf 'repository=%s\ncommit=%s\nref=%s\nsdk=%s\nformat=%s\nrun=%s/%s/actions/runs/%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF" "${{ matrix.sdk }}" "${{ matrix.ext }}" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > package-provenance/BUILD-SOURCE.txt
          find bin/packages -type f -name 'luci-theme-nova${{ matrix.package_separator }}*.${{ matrix.ext }}' -print0 | \
            sort -z | xargs -0 sha256sum > package-provenance/SHA256SUMS
      - name: Upload built ${{ matrix.ext }} packages
        uses: actions/upload-artifact@v4
        with:
          name: luci-nova-${{ matrix.series }}-${{ matrix.ext }}
          path: |
            bin/packages/**/luci-theme-nova${{ matrix.package_separator }}*.${{ matrix.ext }}
            package-provenance/
          if-no-files-found: error
      - name: Upload TEST ONLY signed APKs and disposable public key
        if: matrix.ext == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: TEST-ONLY-luci-nova-${{ matrix.series }}-signed-apk
          path: ${{ runner.temp }}/nova-test-signed/
          if-no-files-found: error
          retention-days: 7

