name: Review Nova visual design
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Chinese screenshot font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify source behavior and cache versions
        env:
          NOVA_ASSET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --test tests/dashboard.test.js tests/native-lists.test.js tests/navigation.test.js tests/menu-localization.test.js tests/package-independence.test.js tests/asset-version.test.js
      - name: Review responsive design and interactions
        env:
          NOVA_SCREENSHOT_DIR: ${{ runner.temp }}/nova-visual-review
          XDG_CACHE_HOME: ${{ runner.temp }}/nova-visual-cache
        run: |
          mkdir -p "$XDG_CACHE_HOME/fontconfig"
          fc-cache
          node --test --test-concurrency=1 tests/browser-layout.test.js tests/navigation-browser.test.js tests/native-lists-browser.test.js tests/visual-browser.test.js tests/native-spacing-browser.test.js
      - name: Upload synthetic design review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-visual-review-source
          path: ${{ runner.temp }}/nova-visual-review/
          if-no-files-found: warn
