name: Build signed APK packages

on:
  push:
    branches: [main, ci/sign-nova-0.2.3-test]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # No signing on pull requests, forks, or manually selected feature branches.
    if: github.repository == 'qusica/luci-nova' && (github.ref == 'refs/heads/main' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require release commit to belong to main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Check JavaScript syntax
        run: |
          node --check luci-app-nova-dashboard/htdocs/luci-static/resources/view/nova/dashboard.js
          node --check luci-theme-nova/htdocs/luci-static/nova/nova-shell.js
          node --check luci-theme-nova/htdocs/luci-static/nova/nova-lists.js
      - name: Test dashboard rendering
        run: node --test tests/dashboard.test.js tests/native-lists.test.js
      - name: Test asset cache versions
        env:
          NOVA_ASSET_BASE: ${{ github.event.before }}
        run: node --test tests/asset-version.test.js
      - name: Test dashboard and navigation layout in Chrome
        run: node --test tests/browser-layout.test.js
      - name: Test native overview and connection lists in Chrome
        run: node --test tests/native-lists-browser.test.js
      - name: Test click-only menu interactions in Chrome
        run: node --test tests/navigation-browser.test.js
      - name: Build unsigned APKs without access to signing credentials
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: x86_64-25.12.6
          FEEDNAME: nova
          PACKAGES: luci-theme-nova luci-app-nova-dashboard
          BUILD_LOG: 1
      - name: Upload intermediate packages for this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intermediate-unsigned-apk-${{ github.run_id }}
          path: |
            bin/packages/**/luci-theme-nova-*.apk
            bin/packages/**/luci-app-nova-dashboard-*.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download only this run's unsigned packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: intermediate-unsigned-apk-${{ github.run_id }}
          path: unsigned
      - name: Install signing tool build dependencies before loading secrets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev
      - name: Build pinned and checksummed APK tool
        run: bash scripts/build-host-apk.sh "$RUNNER_TEMP/nova-host-apk"
      - name: Sign each package and verify against reviewed key fingerprint
        shell: bash
        env:
          NOVA_APK_SIGNING_KEY: ${{ secrets.NOVA_APK_SIGNING_KEY }}
          NOVA_APK_SIGNING_PUBLIC_KEY_SHA256: ${{ vars.NOVA_APK_SIGNING_PUBLIC_KEY_SHA256 }}
        run: |
          set +x
          set -euo pipefail
          mapfile -d '' themes < <(find unsigned -type f -name 'luci-theme-nova-*.apk' -print0)
          mapfile -d '' dashboards < <(find unsigned -type f -name 'luci-app-nova-dashboard-*.apk' -print0)
          test "${#themes[@]}" -eq 1
          test "${#dashboards[@]}" -eq 1
          bash scripts/sign-release-apks.sh "$RUNNER_TEMP/nova-host-apk/build/src/apk" \
            "${themes[0]}" "${dashboards[0]}" "$RUNNER_TEMP/nova-release-signed"
      - name: Record source provenance
        shell: bash
        run: |
          printf 'repository=%s\ncommit=%s\nref=%s\nrun=%s/%s/actions/runs/%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/nova-release-signed/BUILD-SOURCE.txt"
      - name: Upload verified signed packages and public key only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: luci-nova-25.12-signed-apk-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nova-release-signed/*.apk
            ${{ runner.temp }}/nova-release-signed/nova-signing-public.pem
            ${{ runner.temp }}/nova-release-signed/PUBLIC-KEY-SHA256.txt
            ${{ runner.temp }}/nova-release-signed/SHA256SUMS
            ${{ runner.temp }}/nova-release-signed/BUILD-SOURCE.txt
          if-no-files-found: error
          retention-days: 30

  development-test-once:
    # Temporary branch only. Production build/sign gates above stay unchanged.
    if: github.repository == 'qusica/luci-nova' && github.event_name == 'push' && github.ref == 'refs/heads/ci/sign-nova-0.2.3-test' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout reviewed one-time guard only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: guard
          sparse-checkout: |
            .github/workflows/signed-apk.yml
            scripts/prepare-development-signing.py
            tests/development-signing.test.py
          sparse-checkout-cone-mode: false
      - name: Test one-time guard without secrets
        run: python3 guard/tests/development-signing.test.py
      - name: Validate successful source run and acquire exact pinned unsigned artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 guard/scripts/prepare-development-signing.py "$RUNNER_TEMP/nova-development-input"
      - name: Checkout trusted production signer, never development signing scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: beaf5c7557b153f7e2b7ca3c7907a8b26a88890b
          persist-credentials: false
          path: trusted
          sparse-checkout: scripts
      - name: Install signing tool build dependencies before loading secrets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev
      - name: Build trusted pinned and checksummed APK tool without signing secret
        run: bash trusted/scripts/build-host-apk.sh "$RUNNER_TEMP/nova-host-apk"
      - name: Sign exact development pair and strictly verify existing trust
        shell: bash
        env:
          NOVA_APK_SIGNING_KEY: ${{ secrets.NOVA_APK_SIGNING_KEY }}
          # Existing 0.2.1 publisher key, independently verified from installed trust.
          NOVA_APK_SIGNING_PUBLIC_KEY_SHA256: 1475de2470b41a6c99263996ebc44b393bdf385d3639991514563d5c89054140
        run: |
          set +x
          set -euo pipefail
          bash trusted/scripts/sign-release-apks.sh "$RUNNER_TEMP/nova-host-apk/build/src/apk" \
            "$RUNNER_TEMP/nova-development-input/luci-theme-nova-0.2.3-r1.apk" \
            "$RUNNER_TEMP/nova-development-input/luci-app-nova-dashboard-0.2.3-r1.apk" \
            "$RUNNER_TEMP/nova-development-signed"
      - name: Add development provenance and checksum it
        run: |
          cp "$RUNNER_TEMP/nova-development-input/BUILD-SOURCE.json" "$RUNNER_TEMP/nova-development-signed/BUILD-SOURCE.json"
          cd "$RUNNER_TEMP/nova-development-signed"
          sha256sum BUILD-SOURCE.json PUBLIC-KEY-SHA256.txt >> SHA256SUMS
      - name: Upload DEVELOPMENT-TEST packages and public material only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DEVELOPMENT-TEST-luci-nova-0.2.3-r1-a0ce5dd2b474
          path: |
            ${{ runner.temp }}/nova-development-signed/luci-theme-nova-0.2.3-r1.apk
            ${{ runner.temp }}/nova-development-signed/luci-app-nova-dashboard-0.2.3-r1.apk
            ${{ runner.temp }}/nova-development-signed/nova-signing-public.pem
            ${{ runner.temp }}/nova-development-signed/PUBLIC-KEY-SHA256.txt
            ${{ runner.temp }}/nova-development-signed/SHA256SUMS
            ${{ runner.temp }}/nova-development-signed/BUILD-SOURCE.json
          if-no-files-found: error
          retention-days: 7
