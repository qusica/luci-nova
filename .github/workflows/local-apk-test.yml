name: Validate and sign local development APK

on:
  push:
    branches: [ci/sign-nova-0.2.6-local-test]

permissions:
  contents: read
  actions: read

concurrency:
  group: local-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'qusica/luci-nova' && github.event_name == 'push' && github.ref == 'refs/heads/ci/sign-nova-0.2.6-local-test' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed guard and exact local package data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: guard
          sparse-checkout: |
            scripts/prepare-local-signing.py
            tests/local-signing.test.py
            .github/workflows/local-apk-test.yml
            local-signing-input
          sparse-checkout-cone-mode: false
      - name: Test guard and decode only approved local bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 guard/tests/local-signing.test.py
          python3 guard/scripts/prepare-local-signing.py stage guard/local-signing-input "$RUNNER_TEMP/local-input"
      - name: Checkout exact source for packaged tests, never for signing
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e6d0bbe25ff0e95c1c46ca1b29eeec14980982e2
          persist-credentials: false
          path: source
      - name: Check source tree identity
        run: test "$(git -C source rev-parse HEAD^{tree})" = 1cf3623de62d83546c3b7d1e84a71b902cfbff84
      - name: Checkout trusted pinned APK tool builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: beaf5c7557b153f7e2b7ca3c7907a8b26a88890b
          persist-credentials: false
          path: trusted
          sparse-checkout: scripts
      - name: Install tool build dependencies without signing secrets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev fonts-noto-cjk
      - name: Build pinned and checksummed host APK tool
        run: bash trusted/scripts/build-host-apk.sh "$RUNNER_TEMP/host-apk"
      - name: Test exact packaged assets, including all Chrome suites
        env:
          NOVA_SCREENSHOT_DIR: ${{ runner.temp }}/packaged-visual-review
        run: |
          test -s source/tests/visual-browser.test.js
          grep -F '"$stage/tests/visual-browser.test.js"' source/scripts/test-built-apks.sh
          bash source/scripts/test-built-apks.sh "$RUNNER_TEMP/host-apk/build/src/apk" \
            "$RUNNER_TEMP/local-input/luci-theme-nova-0.2.6-r1.apk" \
            "$RUNNER_TEMP/local-input/luci-app-nova-dashboard-0.2.6-r1.apk" \
            "$RUNNER_TEMP/packaged-tests"
      - name: Check original bytes and provenance again after tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 guard/scripts/prepare-local-signing.py verify guard/local-signing-input "$RUNNER_TEMP/local-input"
      - name: Pass only verified data to a fresh signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-local-input-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/local-input/luci-theme-nova-0.2.6-r1.apk
            ${{ runner.temp }}/local-input/luci-app-nova-dashboard-0.2.6-r1.apk
            ${{ runner.temp }}/local-input/BUILD-SOURCE.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload synthetic packaged visual review only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PACKAGED-VISUAL-REVIEW-nova-0.2.6-e6d0bbe25ff0
          path: ${{ runner.temp }}/packaged-visual-review/
          if-no-files-found: warn
          retention-days: 7

  sign:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed guard, not feature-branch executables
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: guard
          sparse-checkout: |
            scripts/prepare-local-signing.py
            local-signing-input/manifest.json
          sparse-checkout-cone-mode: false
      - name: Download only this run's validated pair
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-local-input-${{ github.run_id }}
          path: validated
      - name: Recheck immutable package hashes and source before key access
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 guard/scripts/prepare-local-signing.py verify guard/local-signing-input validated
      - name: Checkout trusted production signer, never local build scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: beaf5c7557b153f7e2b7ca3c7907a8b26a88890b
          persist-credentials: false
          path: trusted
          sparse-checkout: scripts
      - name: Install signing tool dependencies before loading secrets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev
      - name: Build trusted pinned APK tool before loading secrets
        run: bash trusted/scripts/build-host-apk.sh "$RUNNER_TEMP/host-apk"
      - name: Sign approved local pair and strictly verify original key
        shell: bash
        env:
          NOVA_APK_SIGNING_KEY: ${{ secrets.NOVA_APK_SIGNING_KEY }}
          NOVA_APK_SIGNING_PUBLIC_KEY_SHA256: 1475de2470b41a6c99263996ebc44b393bdf385d3639991514563d5c89054140
        run: |
          set +x
          set -euo pipefail
          bash trusted/scripts/sign-release-apks.sh "$RUNNER_TEMP/host-apk/build/src/apk" \
            validated/luci-theme-nova-0.2.6-r1.apk validated/luci-app-nova-dashboard-0.2.6-r1.apk \
            "$RUNNER_TEMP/local-signed"
      - name: Include source provenance and checksums
        run: |
          cp validated/BUILD-SOURCE.json "$RUNNER_TEMP/local-signed/BUILD-SOURCE.json"
          cd "$RUNNER_TEMP/local-signed"
          sha256sum BUILD-SOURCE.json PUBLIC-KEY-SHA256.txt >> SHA256SUMS
      - name: Upload development test pair and public material only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LOCAL-DEVELOPMENT-TEST-luci-nova-0.2.6-r1-e6d0bbe25ff0
          path: |
            ${{ runner.temp }}/local-signed/luci-theme-nova-0.2.6-r1.apk
            ${{ runner.temp }}/local-signed/luci-app-nova-dashboard-0.2.6-r1.apk
            ${{ runner.temp }}/local-signed/nova-signing-public.pem
            ${{ runner.temp }}/local-signed/PUBLIC-KEY-SHA256.txt
            ${{ runner.temp }}/local-signed/SHA256SUMS
            ${{ runner.temp }}/local-signed/BUILD-SOURCE.json
          if-no-files-found: error
          retention-days: 7
